name: AppSec CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  sast-semgrep:
    name: SAST - Semgrep (Soft Advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep OSS
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep \
            semgrep scan --config=auto --sarif -o semgrep-results.sarif /src
        continue-on-error: true

      - name: Upload Semgrep Report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.sarif

  secrets-gitleaks:
      name: Secrets - Gitleaks (Hard Gate)
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
          with:
            fetch-depth: 0 # Crucial: Scans full git history, not just the latest commit

        - name: Run Gitleaks
          uses: gitleaks/gitleaks-action@v2
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          with:
            report_format: sarif
            report_path: gitleaks-results.sarif
          continue-on-error: true # Set to true to allow DAST to run, but conceptually a Hard Gate

        - name: Upload Gitleaks Report
          uses: actions/upload-artifact@v4
          with:
            name: gitleaks-results
            path: gitleaks-results.sarif

  sca-trivy:
    name: SCA & Container - Trivy (Soft Advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan FS & Dependencies (SCA)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-fs-results.txt'
          severity: 'CRITICAL,HIGH,MEDIUM'
        continue-on-error: true
      
      - name: Scan Container Image (Container Security)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'bkimminich/juice-shop:latest'
          format: 'table'
          output: 'trivy-image-results.txt'
          severity: 'CRITICAL,HIGH,MEDIUM'
        continue-on-error: true

      - name: Upload Trivy Reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: |
            trivy-fs-results.txt
            trivy-image-results.txt

  iac-cloud-security:
    name: IaC & Misconfiguration - Checkov (Hard Gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov IaC Scanner (Hard Quality Gate)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: 'terraform/'
          framework: 'terraform'
          output_format: 'cli,sarif'
          output_file_path: 'console,checkov-results.sarif'
          soft_fail: true # Set to true in audit/demo mode to allow downstream DAST execution
          check: 'CKV_AWS_1,CKV_AWS_62,CKV_AWS_24,CKV_AWS_20'

      - name: Upload Checkov Report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-results
          path: checkov-results.sarif

  dast-zap:
    name: DAST - OWASP ZAP Baseline (Soft Advisory)
    runs-on: ubuntu-latest
    needs: [sast-semgrep, secrets-gitleaks, sca-trivy, iac-cloud-security]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Running official pre-built image to optimize CI execution time (~15s vs ~8m full build).
      # See README.md for local build substitution instructions.
      - name: Start Juice Shop Container (Optimized Baseline)
        run: |
          docker run -d --name juice-shop -p 3000:3000 bkimminich/juice-shop
          timeout 60s bash -c 'until curl -s http://localhost:3000; do sleep 3; done'

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          allow_issue_writing: false
          fail_action: false
          artifact_name: 'zap-baseline-report'